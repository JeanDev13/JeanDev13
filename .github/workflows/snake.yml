name: Gerar gráfico Snake

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 03:00 UTC (00:00 em Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs do Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots: exatamente 5 cores. A 1ª é "sem contribuição", depois vai do menos ao mais ativo.
          outputs: |
            dist/github-snake.svg?color_snake=#0F172A&color_dots=#EBEDF0,#BFDBFE,#93C5FD,#3B82F6,#1D4ED8
            dist/github-snake-dark.svg?color_snake=#E2E8F0&color_dots=#161B22,#1E3A8A,#1D4ED8,#2563EB,#60A5FA

      - name: Publicar na branch output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: atualizar gráfico snake"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
